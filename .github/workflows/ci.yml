name: CI

# The deployment gate. Production used to come straight from Vercel's Git
# integration, which meant the only check standing between a push and
# musiccharts.tools was whatever `pnpm build` happened to run — jest, and
# nothing else. Next 16 dropped build-time linting, so eslint and the
# typechecker were not gating anything at all.
#
# Now `vercel.json` turns off Vercel's own deployments from `main`
# (`git.deploymentEnabled`), and production ships from the `deploy` job below,
# which cannot start until test + lint + typecheck have all gone green. The
# gate is structural: there is no path from a push to production that skips
# them. Preview deployments for other branches still come from Vercel's Git
# integration and are deliberately left ungated.
#
# The three check jobs run concurrently on their own runners, so the wall
# clock is the slowest one (jest) rather than the sum — which is also why the
# suite is no longer in `pnpm build`.

on:
  push:
    branches: [main]
  pull_request:

# A superseded PR push is worth cancelling. A superseded push to main is not:
# cancelling mid-`vercel deploy` can leave a half-promoted deployment.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    working-directory: spotify-clonehero-next

jobs:
  test:
    name: Jest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable pnpm
        run: corepack enable

      # This job is the one that genuinely needs the postinstall scripts: the
      # local-db and drum-fills suites run against better-sqlite3, which has to
      # be built. supabase's postinstall pulls a binary from GitHub releases in
      # the same pass and can come back with a connection reset, so retry
      # rather than fail the whole gate on a flaky download.
      - name: Install dependencies
        run: |
          for i in 1 2 3; do
            pnpm install --frozen-lockfile && exit 0
            echo "install attempt $i failed, retrying in $((i * 10))s"
            sleep $((i * 10))
          done
          exit 1

      # jest.config.js parks the transform cache in .next/cache/jest so Vercel
      # keeps it between builds; do the same here rather than transforming all
      # 384 test files from cold on every run.
      - name: Restore jest transform cache
        uses: actions/cache@v6
        with:
          path: spotify-clonehero-next/.next/cache/jest
          key: jest-${{ runner.os }}-${{ hashFiles('spotify-clonehero-next/pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            jest-${{ runner.os }}-${{ hashFiles('spotify-clonehero-next/pnpm-lock.yaml') }}-
            jest-${{ runner.os }}-

      - name: Run tests
        run: pnpm test --ci
        env:
          NODE_ENV: test

  lint:
    name: ESLint + Prettier
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable pnpm
        run: corepack enable

      # eslint and prettier need no native binaries, so skip the postinstall
      # scripts: it is faster, and it avoids supabase's postinstall download
      # from GitHub releases, which is what failed this job's first run.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Lint
        run: pnpm lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable pnpm
        run: corepack enable

      # tsgo needs no native binaries either — see the lint job above.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Typecheck
        run: pnpm typecheck

  deploy:
    name: Deploy to production
    needs: [test, lint, typecheck]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Long enough to outlast a full crawl it may be waiting on. The wait ends
    # early on its own if no rebuild is in flight, so this ceiling is only
    # reached when one genuinely runs that long.
    timeout-minutes: 330
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    env:
      # The CLI reads all three of these from the environment, so none of them
      # belong on a command line. Passing the token as a --token flag also
      # turns an unset secret into an empty string, which the CLI reports as a
      # malformed flag rather than as "you are not authenticated".
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable pnpm
        run: corepack enable

      # The Vercel CLI is run from the repository root, not from
      # spotify-clonehero-next: the project's Root Directory setting is part of
      # what `vercel pull` fetches, and the CLI applies it itself. Running from
      # inside the app directory would apply it twice.
      # --scope is not redundant with VERCEL_ORG_ID. A local `vercel login`
      # carries a current team that the CLI falls back on; a token carries no
      # such context, so on a team-owned project the same env vars that
      # resolve fine on a laptop return "Could not retrieve Project Settings"
      # here. Naming the scope explicitly is what makes token auth resolve it.
      # The published catalog and this build must agree on a generation, or
      # clients get an app that refuses the manifest it is pointed at.
      #
      # A generation bump starts update-chart-db on the same push, and a full
      # crawl takes hours, so this waits for that run rather than failing and
      # leaving someone to notice and re-run it. It only waits while a rebuild
      # is actually in flight: if none is running or queued, nothing is going
      # to fix the mismatch and waiting would just burn the job's timeout.
      #
      # The constant is read with grep rather than tsx so this job does not
      # have to install the workspace to check one integer. An unreadable value
      # fails the step, so a refactor that breaks the pattern blocks the deploy
      # instead of quietly skipping the check.
      - name: Wait for a matching published catalog
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          expected="$(grep -oE 'CHART_DB_DATA_VERSION = [0-9]+' \
            spotify-clonehero-next/lib/chorusChartDb/chartDbAssets.ts \
            | grep -oE '[0-9]+$')"
          if [ -z "$expected" ]; then
            echo "::error::Could not read CHART_DB_DATA_VERSION"
            exit 1
          fi

          published() {
            curl -fsS https://assets.musiccharts.tools/charts/manifest.json \
              | jq -r '.dataVersion // empty' || true
          }

          rebuilds_in_flight() {
            gh run list --workflow 'Update chart DB' --branch main \
              --status in_progress --status queued --json databaseId \
              --jq 'length' 2>/dev/null || echo 0
          }

          for _ in $(seq 1 300); do
            current="$(published)"
            if [ "$current" = "$expected" ]; then
              echo "Published catalog is generation $current, matching this build."
              exit 0
            fi
            if [ "$(rebuilds_in_flight)" = "0" ]; then
              echo "::error::Published catalog is generation ${current:-none}; this build serves $expected, and no Update chart DB run is in flight to close the gap. Start one, or revert the generation bump."
              exit 1
            fi
            echo "Catalog is generation ${current:-none}, waiting for $expected (rebuild in flight)..."
            sleep 60
          done

          echo "::error::Gave up waiting for generation $expected after 5 hours."
          exit 1

      - name: Pull Vercel project settings
        working-directory: .
        run: npx vercel@58 pull --yes --environment=production --scope "$VERCEL_ORG_ID"

      - name: Build
        working-directory: .
        run: npx vercel@58 build --prod --scope "$VERCEL_ORG_ID"

      - name: Deploy
        id: deploy
        working-directory: .
        run: |
          url="$(npx vercel@58 deploy --prebuilt --prod --scope "$VERCEL_ORG_ID")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed $url" >> "$GITHUB_STEP_SUMMARY"
